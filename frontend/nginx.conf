server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user and
    # cannot bind a privileged port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to every caller.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck target. Logged nowhere, so a probe every 15s does
    # not bury the real request log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # browsers keep loading the previous deploy's bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container, which keeps the browser
    # on a single origin and avoids CORS entirely.
    location /api/ {
        # Docker's embedded DNS. Without an explicit resolver nginx looks the
        # backend up once, at startup, and caches the address for the process
        # lifetime — so every request 502s after the backend is recreated on a
        # new IP. A variable in proxy_pass forces the lookup per request.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;

        # Strip the prefix: "/api/health" -> backend "/health". Done with a
        # rewrite because proxy_pass cannot carry a URI part when its target is
        # a variable. The query string is preserved automatically.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /analyze-alert waits on a live LLM call. nginx's 60s default would
        # cut the connection with a 504 long before the backend gives up.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Stream the response through instead of buffering the whole body.
        proxy_buffering off;
    }
}
