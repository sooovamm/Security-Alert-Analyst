services:
  backend:
    build: ./backend
    # Secrets and config come from .env (gitignored). Never baked into the image.
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      # Alerts + knowledge corpus, mounted read-only.
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
